AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Private immutable response collector for the genre listening test

Parameters:
  AllowedOrigin:
    Type: String
    Description: Exact GitHub Pages origin, for example https://example.github.io
    AllowedPattern: ^(https://[A-Za-z0-9.-]+|http://(localhost|127\.0\.0\.1)(:[0-9]{1,5})?)$
  QuestionBankKey:
    Type: String
    Description: Content-addressed private question-bank key in StorageBucket
    AllowedPattern: ^question-banks/[0-9a-f]{64}\.json$
  ResponseRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 36500

Resources:
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref ResponseRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StorageBucket.Arn
              - !Sub ${StorageBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Validate and store complete listening-test room submissions
      CodeUri: .
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          STORAGE_BUCKET: !Ref StorageBucket
          QUESTION_BANK_KEY: !Ref QuestionBankKey
          RESPONSES_PREFIX: responses/
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadPrivateQuestionBank
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${StorageBucket.Arn}/${QuestionBankKey}
            - Sid: WriteAndCheckResponses
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${StorageBucket.Arn}/responses/*

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CollectorFunction}
      RetentionInDays: 30

  CollectorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowCredentials: false
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
        AllowOrigins:
          - !Ref AllowedOrigin
        MaxAge: 600
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt CollectorFunction.Arn

  CollectorFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref CollectorFunction
      FunctionUrlAuthType: NONE
      Principal: "*"

  CollectorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CollectorFunction
      InvokedViaFunctionUrl: true
      Principal: "*"

Outputs:
  CollectorUrl:
    Description: Put this URL in listening_test/site/config.js
    Value: !GetAtt CollectorFunctionUrl.FunctionUrl
  StorageBucketName:
    Description: Private bucket containing question bank and immutable responses
    Value: !Ref StorageBucket
  ResponsePrefix:
    Value: responses/
